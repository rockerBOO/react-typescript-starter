---
name: Tests CI

on:
  pull_request:
  push:
    branches:
      - 'main'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Test using Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: yarn install
      - run: yarn test:ci
